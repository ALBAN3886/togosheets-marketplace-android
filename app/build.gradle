plugins {
    id 'com.android.application'
}

// Le CI (GitHub Actions) passe -PbuildVersionCode=<numéro de build> ;
// en local (Android Studio), on retombe sur 1 par défaut.
def appVersionCode = project.hasProperty('buildVersionCode') ? project.property('buildVersionCode').toInteger() : 1

android {
    namespace 'com.aet.togosheets'
    compileSdk 34

    defaultConfig {
        applicationId "com.aet.togosheets.marketplace"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName "1.0." + appVersionCode
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
